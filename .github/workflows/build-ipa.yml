name: Build CheatStore VN IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      ipa_name:
        description: "Tên file IPA xuất ra (không cần đuôi .ipa)"
        required: false
        default: "CheatStore-VN"

jobs:
  build:
    name: Biên dịch và Đóng gói IPA
    runs-on: macos-14
    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Kiểm tra phiên bản Xcode
        run: |
          xcodebuild -version

      - name: Biên dịch ứng dụng (xcodebuild)
        run: |
          set -o pipefail
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log || {
              echo "::error title=Xcode Compilation Failed::xcodebuild finished with error"
              echo "==================== COMPILER ERRORS ===================="
              grep -E "error:" xcodebuild.log || tail -n 80 xcodebuild.log
              echo "========================================================"
              exit 1
            }

      - name: Đóng gói thành file IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/3105.app Payload/cheatstorevip.app
          
          # Inject Logo vào Bundle để app hiển thị tức thì
          cp -v ThreeOneOSFive/CheatLogo.png Payload/cheatstorevip.app/ || true
          cp -v ThreeOneOSFive/CheatStoreLogo.jpg Payload/cheatstorevip.app/ || true

          # Inject EngineData (.dat) - Hoàn toàn không để lộ file .3105 hay thư mục BundledPatches
          if [ -d "ThreeOneOSFive/EngineData" ]; then
            echo "Injecting EngineData (.dat)..."
            cp -v ThreeOneOSFive/EngineData/*.dat Payload/cheatstorevip.app/ || true
          fi
          
          # Dọn dẹp triệt để nếu có file .3105 hoặc thư mục BundledPatches
          rm -rf Payload/cheatstorevip.app/BundledPatches || true
          rm -f Payload/cheatstorevip.app/*.3105 || true
          
          IPA_FILENAME="${{ github.event.inputs.ipa_name || 'CheatStore-VN' }}.ipa"
          zip -r "$IPA_FILENAME" Payload
          echo "IPA_PATH=$IPA_FILENAME" >> $GITHUB_ENV
          echo "Đã tạo thành công: $IPA_FILENAME"

      - name: Lưu trữ file IPA lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_PATH }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14
