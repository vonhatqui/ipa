name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme "3105" \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" | tail -30

      - name: Package unsigned IPA
        run: |
          echo "=== Searching for .app ==="
          find $RUNNER_TEMP/DerivedData -name "*.app" -type d

          APP_PATH=$(find $RUNNER_TEMP/DerivedData/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "*.app" -type d | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            find $RUNNER_TEMP/DerivedData -type d -maxdepth 5
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          echo "App name: $APP_NAME"

          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r 3105-v2.0-unsigned.ipa Payload
          echo "✅ IPA created: $(du -sh 3105-v2.0-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-v2.0-unsigned
          path: ${{ runner.temp }}/3105-v2.0-unsigned.ipa
          retention-days: 90
