name: Build CheatStore VN IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      ipa_name:
        description: "Tên file IPA xuất ra (không cần đuôi .ipa)"
        required: false
        default: "CheatStore-VN"
      build_config:
        description: "Chế độ biên dịch"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      xcode_version:
        description: "Phiên bản Xcode (để trống = mới nhất)"
        required: false
        default: "latest"

jobs:
  build:
    name: Biên dịch và Đóng gói IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Chọn phiên bản Xcode
        run: |
          if [ "${{ github.event.inputs.xcode_version }}" != "latest" ] && [ -n "${{ github.event.inputs.xcode_version }}" ]; then
            sudo xcode-select -s /Applications/Xcode_${{ github.event.inputs.xcode_version }}.app || {
              echo "⚠️ Xcode ${{ github.event.inputs.xcode_version }} không tìm thấy, dùng bản mặc định"
              ls /Applications/ | grep Xcode
            }
          fi
          echo "=== Xcode đang sử dụng ==="
          xcodebuild -version
          echo "=== SDK có sẵn ==="
          xcodebuild -showsdks | grep iphoneos

      - name: Liệt kê Schemes có sẵn
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Biên dịch ứng dụng (xcodebuild)
        run: |
          BUILD_CONFIG="${{ github.event.inputs.build_config || 'Release' }}"
          echo "🔨 Biên dịch chế độ: $BUILD_CONFIG"

          # Tự động chọn scheme ưu tiên CheatStore
          SCHEME="CheatStore"
          if ! xcodebuild -project ThreeOneOSFive.xcodeproj -list | grep -q "CheatStore"; then
            SCHEME="3105"
          fi
          echo "🎯 Đang build với Scheme: $SCHEME"

          set -o pipefail
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            build 2>&1 | tee xcodebuild.log || {
              echo ""
              echo "::error title=Xcode Build Failed::Biên dịch thất bại"
              echo ""
              echo "==================== LỖI BIÊN DỊCH ===================="
              grep -A 2 "error:" xcodebuild.log | head -60 || tail -n 100 xcodebuild.log
              echo "======================================================="
              exit 1
            }

          echo "✅ Biên dịch thành công!"

      - name: Đóng gói thành file IPA
        run: |
          BUILD_CONFIG="${{ github.event.inputs.build_config || 'Release' }}"
          APP_DIR="build/Build/Products/${BUILD_CONFIG}-iphoneos"

          # Tìm file .app
          APP_PATH=$(find "$APP_DIR" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Không tìm thấy file .app trong $APP_DIR"
            ls -la "$APP_DIR" || echo "Thư mục không tồn tại"
            exit 1
          fi
          echo "📦 Tìm thấy app: $APP_PATH"

          # Tạo Payload sạch sẽ
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/cheatstorevip.app
          TARGET_APP="Payload/cheatstorevip.app"

          # 1. Đổi tên executable 3105 thành CheatStore (nếu còn sót binary tên 3105)
          if [ -f "$TARGET_APP/3105" ]; then
            echo "🔄 Đổi tên binary: 3105 -> CheatStore..."
            mv "$TARGET_APP/3105" "$TARGET_APP/CheatStore"
          fi

          # 2. Cập nhật Info.plist: đảm bảo CFBundleExecutable trỏ đúng vào CheatStore
          if [ -f "$TARGET_APP/Info.plist" ]; then
            plutil -replace CFBundleExecutable -string "CheatStore" "$TARGET_APP/Info.plist" 2>/dev/null || true
            plutil -replace CFBundleName -string "CheatStore VN" "$TARGET_APP/Info.plist" 2>/dev/null || true
          fi

          # 3. Gom toàn bộ file mod .dat vào DUY NHẤT thư mục AppCore/
          # Tuyệt đối KHÔNG copy .dat ra ngoài root
          mkdir -p "$TARGET_APP/AppCore"
          if [ -d "ThreeOneOSFive/AppCore" ]; then
            echo "📂 Đang copy AppCore/*.dat vào $TARGET_APP/AppCore/..."
            cp -v ThreeOneOSFive/AppCore/*.dat "$TARGET_APP/AppCore/" 2>/dev/null || true
          fi
          if [ -d "ThreeOneOSFive/EngineData" ]; then
            cp -v ThreeOneOSFive/EngineData/*.dat "$TARGET_APP/AppCore/" 2>/dev/null || true
          fi

          # 4. Gom ảnh phụ trợ vào AppCore/Assets/ (không để rải rác ở root)
          mkdir -p "$TARGET_APP/AppCore/Assets"
          if [ -d "ThreeOneOSFive/AppCore/Assets" ]; then
            cp -v ThreeOneOSFive/AppCore/Assets/* "$TARGET_APP/AppCore/Assets/" 2>/dev/null || true
          fi
          for asset in CheatLogo.png CheatStoreLogo.jpg FreeFireIcon.png skin_ignis.jpeg skin_naco.png; do
            if [ -f "ThreeOneOSFive/$asset" ]; then
              cp -v "ThreeOneOSFive/$asset" "$TARGET_APP/AppCore/Assets/" 2>/dev/null || true
            fi
          done

          # 5. DỌN DẸP TRIỆT ĐỂ ROOT: Xóa sạch toàn bộ file bừa bãi và lộ liễu
          echo "🧹 Dọn dẹp sạch sẽ thư mục gốc cheatstorevip.app..."
          rm -f "$TARGET_APP"/*.dat 2>/dev/null || true
          rm -f "$TARGET_APP"/*.3105 2>/dev/null || true
          rm -f "$TARGET_APP"/*.bak 2>/dev/null || true
          rm -f "$TARGET_APP"/*.log 2>/dev/null || true
          rm -f "$TARGET_APP"/CheatLogo.png "$TARGET_APP"/CheatStoreLogo.jpg "$TARGET_APP"/FreeFireIcon.png 2>/dev/null || true
          rm -f "$TARGET_APP"/skin_ignis.jpeg "$TARGET_APP"/skin_naco.png 2>/dev/null || true
          rm -rf "$TARGET_APP"/BundledPatches 2>/dev/null || true

          echo "📋 Danh sách các file trong app sau khi tối ưu gọn gàng:"
          ls -la "$TARGET_APP"

          # Đóng gói IPA
          IPA_FILENAME="${{ github.event.inputs.ipa_name || 'CheatStore-VN' }}.ipa"
          zip -r -9 "$IPA_FILENAME" Payload
          
          # Tính checksum
          SHA256=$(shasum -a 256 "$IPA_FILENAME" | awk '{print $1}')
          IPA_SIZE=$(du -h "$IPA_FILENAME" | awk '{print $1}')

          echo "IPA_PATH=$IPA_FILENAME" >> $GITHUB_ENV
          echo "IPA_SHA256=$SHA256" >> $GITHUB_ENV

          echo ""
          echo "============================================"
          echo "✅ ĐÃ TẠO THÀNH CÔNG: $IPA_FILENAME"
          echo "📏 Kích thước: $IPA_SIZE"
          echo "🔐 SHA-256: $SHA256"
          echo "============================================"

      - name: Lưu trữ file IPA lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_PATH }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Lưu build log (nếu lỗi)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
